<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Truly Human AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 760px;
      text-align: center;
    }

    .brand {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 18px;
      color: #111827;
    }

    .tagline {
      font-size: 26px;
      font-weight: 500;
      margin-bottom: 28px;
      color: #374151;
    }

    .message {
      font-size: 18px;
      line-height: 1.7;
      color: #6b7280;
      margin-bottom: 34px;
    }

    .coming-soon {
      display: inline-block;
      padding: 12px 22px;
      border: 1px solid #d1d5db;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 34px;
      background: white;
    }

    .linkedin {
      display: inline-block;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 8px;
      background: #0a66c2;
      color: white;
      font-weight: 600;
    }

    .linkedin:hover {
      opacity: 0.9;
    }

    .footer {
      margin-top: 50px;
      font-size: 14px;
      color: #9ca3af;
    }

    @media (max-width: 600px) {
      .brand {
        font-size: 36px;
      }

      .tagline {
        font-size: 22px;
      }

      .message {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      Truly Human AI
    </div>

    <div class="tagline">
      Practical AI. Meaningful Human Impact.
    </div>

    <div class="message">
      We are building practical AI-powered products and solutions
      that bring together intelligent technology and human experience.
      <br><br>
      Our new website is coming soon.
    </div>

    <div class="coming-soon">
      Coming Soon
    </div>

    <br>

    <a
      class="linkedin"
      href="https://www.linkedin.com/company/trulyhumanai/"
      target="_blank"
    >
      Follow us on LinkedIn
    </a>

    <div class="footer">
      © 2026 Truly Human AI
    </div>

  </div>

</body>
</html>
